<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cipherdrop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    
    <!-- Navbar -->
    <div class="navbar">
        <img src="assets/logo_white.png" alt="logo">
        <h1>Cipherdrop</h1>
        <div class="dropdown">
            <button class="dropbtn">Menu</button>
            <div class="dropdown-content">
                <a href="/">Home</a>
                <a href="/register">Register Message</a>
                <a href="/read">Read Message</a>
            </div>
        </div>
    </div>
    <!-- Main Content -->
    <div class="main-content">
        <div class="readAndRegistermain-content">
            <form onsubmit="readMessage(event)">
                <h2>Read a Message</h2>
                <label for="messageId">Message ID:</label><br>
                <input type="text" id="messageId" name="messageId" required><br><br>
            
                <label for="password">Password for Decryption:</label>
                <input type="password" id="password" name="password" required><br><br>

                <button type="submit">Read Message</button>
            </form>
        </div>
        <div id="result">
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

</body>
</html>
